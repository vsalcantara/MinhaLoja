
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja</title>

    <link rel="stylesheet" href="style.css">

    <!-- Biblioteca do gráfico -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="header">
        <div class="logo">
            <div class="logo-icon">🏪</div>
            <div>
                <h1>Minha Loja</h1>
                <p>Controle de Produtos e Vendas</p>
            </div>
        </div>
    </header>

    <main class="container">

        <!-- PRODUTOS -->
        <section class="section products-section">

            <div class="section-header">
                <h2>📦 Produtos</h2>
                <button class="btn-primary" onclick="openModal()">
                    + Novo
                </button>
            </div>

            <input
                type="text"
                id="searchProduct"
                placeholder="🔎 Buscar produto..."
                class="search-input"
            >

            <div id="productsList" class="products-list"></div>

        </section>

        <!-- VENDA -->
        <section class="section sales-section">

            <h2>🛒 Venda Atual</h2>

            <div id="salesList" class="sales-list"></div>

            <div class="sale-footer">
                <div class="sale-total">
                    <span>Total da venda</span>
                    <strong id="currentTotal">R$ 0,00</strong>
                </div>

                <button class="btn-calculate" onclick="calculateSale()">
                    🧮 Calcular Venda
                </button>
            </div>

        </section>

        <!-- RESULTADOS -->
        <section class="section results-section">

            <h2>📊 Resultado da Venda</h2>

            <div class="results-cards">

                <div class="result-card">
                    <span>🛒 Itens Vendidos</span>
                    <strong id="totalItems">0</strong>
                </div>

                <div class="result-card">
                    <span>💰 Valor Recebido</span>
                    <strong id="totalReceived">R$ 0,00</strong>
                </div>

                <div class="result-card">
                    <span>🏆 Mais Vendido</span>
                    <strong id="bestSeller">---</strong>
                </div>

            </div>

            <div class="chart-container">
                <h3>Vendas por Produto</h3>
                <canvas id="salesChart"></canvas>
                <p id="chartMessage">Registre uma venda para visualizar o gráfico.</p>
            </div>

            <button class="btn-reset" onclick="resetSales()">
                Limpar venda atual
            </button>

        </section>

    </main>

    <!-- MODAL DE PRODUTO -->
    <div class="modal" id="productModal">

        <div class="modal-content">

            <div class="modal-header">
                <h2 id="modalTitle">Novo Produto</h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>

            <form id="productForm">

                <input type="hidden" id="productId">

                <label for="productName">Nome do produto</label>
                <input
                    type="text"
                    id="productName"
                    placeholder="Ex: Coca-Cola 350ml"
                    required
                >

                <label for="productPrice">Preço</label>
                <input
                    type="number"
                    id="productPrice"
                    placeholder="0,00"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="productImage">Imagem do produto</label>
                <input
                    type="file"
                    id="productImage"
                    accept="image/*"
                >

                <div id="imagePreview"></div>

                <button type="submit" class="btn-primary save-btn">
                    Salvar Produto
                </button>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
